# Proposed addition INSIDE the existing HTTPS server block. Review before applying.
# Does not replace the host's existing server block or Mission Control routes.
location ^~ /arcade-api/ {
    client_max_body_size 41m;
    proxy_pass http://127.0.0.1:8766/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 45s;
    proxy_intercept_errors off;
    # Keep the host-wide login redirect and CSP out of the JSON API.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
