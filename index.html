<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick's Arcade High Scores</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="crt-overlay"></div>
    
    <!-- Header stays fixed on top -->
    <header class="neon-header">
        <h1 class="flicker">NICK'S ARCADE</h1>
        <h2>HIGH SCORES</h2>
    </header>

    <!-- Main crawl area -->
    <div class="crawl-container">
        <main id="arcade-list" class="list">
            <!-- Game rows injected here -->
        </main>
    </div>

    <!-- Login Modal (Admin) -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="login-view">
                <h2>Google Sign-In</h2>
                <button id="google-login-btn" class="neon-btn">Sign in with Google</button>
            </div>
            <div id="admin-view" style="display: none;">
                <h2>ENTER NEW SCORE</h2>
                <input type="text" id="game-search" placeholder="Search Game...">
                <div id="search-results"></div>
                <input type="number" id="new-score" placeholder="Score">
                <input type="text" id="new-initials" placeholder="Initials (3 letters)" maxlength="3">
                <button id="submit-score" class="neon-btn">SUBMIT</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
