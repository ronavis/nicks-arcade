<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick's Arcade High Scores</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="crt-overlay"></div>
    
    <!-- Header stays fixed on top -->
    <header class="neon-header">
        <h1 class="flicker">NICK'S ARCADE</h1>
        <h2>HIGH SCORES</h2>
        <div class="header-controls">
            <div class="settings-btn" id="settingsBtn" title="Admin Settings">⚙️</div>
        </div>
    </header>


    <!-- Main crawl area -->
    <div class="crawl-container">
        <main id="arcade-list" class="list">
            <!-- Game rows injected here -->
        </main>
    </div>

    <!-- Login Modal (Admin) -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="login-view">
                <h2>Google Sign-In</h2>
                <p>Please log in with your Google account.</p>
                <div id="g_id_onload"
                     data-client_id="569822322277-ng39tk1vcecgjfes85bs16umb5k47mc7.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>
            <div id="admin-view" style="display: none;">
                <div class="dashboard-tabs">
                    <button class="tab-btn active" id="tabScores">Update Scores</button>
                    <button class="tab-btn" id="tabAdmins">Manage Admins</button>
                    <button class="tab-btn" id="tabSettings">UI Settings</button>
                </div>
                
                <div id="scoresPanel" class="tab-panel active">
                    <h2>ENTER NEW SCORE</h2>
                    <input type="text" id="game-search" placeholder="Search Game...">
                    <div id="search-results"></div>
                    <input type="number" id="new-score" placeholder="Score">
                    
                    <div style="margin-top: 1rem; color: #0ff;">Enter Initials</div>
                    <div id="arcade-initials-display">
                        <span class="initial-char active" id="char1">_</span>
                        <span class="initial-char" id="char2">_</span>
                        <span class="initial-char" id="char3">_</span>
                    </div>
                    <div id="arcade-keyboard"></div>
                    <input type="hidden" id="new-initials">
                    <label class="custom-file-upload">
                        <input type="file" id="new-proof" accept="image/*" capture="environment">
                        📸 Upload Photo Evidence (Auto-Detects Game & Score)
                    </label>
                    <div id="ocr-status" style="color: var(--neon-yellow); margin-top: 10px; font-size: 0.8rem; display: none;"></div>
                    <button id="submit-score" class="neon-btn">SUBMIT</button>
                    <p id="adminMessage"></p>
                </div>

                <div id="adminsPanel" class="tab-panel" style="display: none;">
                    <h2>MANAGE ADMINS</h2>
                    <ul id="adminList"></ul>
                    <input type="email" id="newAdminEmail" placeholder="admin@gmail.com">
                    <button id="submitAdmin" class="neon-btn" style="margin-top: 10px;">ADD ADMIN</button>
                    <p id="adminManageMessage"></p>
                </div>

                <div id="settingsPanel" class="tab-panel" style="display: none; text-align: left;">
                    <h2>CUSTOMIZE UI</h2>
                    <div style="margin-bottom: 20px;">
                        <label style="color:#0ff; font-size:1.2rem;">Marquee Width (<span id="marqueeSizeDisplay">700</span>px):</label><br>
                        <input type="range" id="marqueeSizeSlider" min="300" max="1000" value="700" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label class="custom-file-upload" style="border-color: var(--neon-pink); color: var(--neon-pink);">
                            <input type="file" id="fontUpload" accept=".ttf,.woff,.woff2">
                            🅰️ Upload Custom Font (.ttf, .woff)
                        </label>
                        <br>
                        <button id="resetFontBtn" class="neon-btn" style="padding: 0.5rem 1rem; font-size:0.8rem; margin-top:15px; border-color:var(--neon-pink); color:var(--neon-pink);">Reset Font</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Photo Viewer Modal -->
    <div id="photo-modal" class="modal">
        <div class="modal-content" style="max-width: 90%; max-height: 90%; display:flex; justify-content:center; align-items:center; padding: 10px;">
            <span class="close-btn" id="closePhotoBtn">&times;</span>
            <img id="photo-viewer-img" src="" style="max-width:100%; max-height:80vh; object-fit:contain; border:2px solid #0ff; border-radius:5px;">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
